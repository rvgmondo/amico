# cPanel Git Version Control deploy manifest.
# Clicking "Deploy HEAD Commit" in cPanel runs these tasks: copy the prebuilt app
# into place, install any new runtime packages, and restart the Node process.
# The build (.next) is committed to the repo, so NO build runs on the server (the
# shared host's process limit makes building there unreliable). No zips.
#
# Uploaded once and left in place across deploys: node_modules, amico.db, media/, tmp/.
---
deployment:
  tasks:
    - export APPROOT=/home/mondocareco/amico.mondocare.co.za/amico
    # Locate the cPanel Node virtualenv npm at any depth (the app-root path is
    # nested, so a fixed glob misses it). Fall back to PATH npm.
    - export NPM=$(find /home/mondocareco/nodevenv -maxdepth 5 -type f -name npm 2>/dev/null | head -1); export NPM=${NPM:-npm}
    # Replace app code + prebuilt output; leave node_modules, amico.db, media, tmp alone.
    - /bin/rm -rf $APPROOT/.next && /bin/cp -R .next $APPROOT/
    # src is NOT read at runtime (Next serves entirely from .next). Overlay it,
    # tolerating a few Payload API route dirs that carry odd ownership and cannot
    # be replaced, so the deploy never aborts on them.
    - /bin/mkdir -p $APPROOT/src && /bin/cp -Rf src/. $APPROOT/src/ 2>/dev/null || true
    - /bin/rm -rf $APPROOT/public && /bin/cp -R public $APPROOT/
    - /bin/rm -rf $APPROOT/scripts && /bin/cp -R scripts $APPROOT/
    # next-env.d.ts is gitignored (regenerated by the build) so it is not in the
    # clone, do not copy it.
    - /bin/cp -f package.json package-lock.json next.config.ts tsconfig.json postcss.config.mjs server.cjs $APPROOT/
    # Non-fatal: node_modules is pre-installed and deps are stable, so a transient
    # npm issue must not abort the deploy (the file copy above is what matters).
    - cd $APPROOT && ( $NPM install --omit=dev --no-audit --no-fund || true )
    # Restart the Passenger/LiteSpeed Node app.
    - /bin/mkdir -p $APPROOT/tmp && /usr/bin/touch $APPROOT/tmp/restart.txt
